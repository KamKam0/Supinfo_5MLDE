[project]
name = "steam-mlops"
version = "0.1.0"
description = "Industrialisation et supervision MLOps du catalogue Steam"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.2.6",
    "scikit-learn==1.6.1",
    "joblib==1.5.1",
    "great-expectations==1.23.2",
    "mlflow==3.16.1",
    "prefect==3.8.7",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "locust==2.46.6",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
